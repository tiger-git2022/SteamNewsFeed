<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>时间线</title>
<style>
/* 颜色跟 WPF-UI（Fluent）一致；页面本身透明，透出窗口的亚克力背景（和 N网 Mod 更新的页面同一套） */
:root {
  --accent: #60cdff;
  --card: rgba(255,255,255,.051); --cardhover: rgba(255,255,255,.07); --card2: rgba(255,255,255,.03); --hover: rgba(255,255,255,.084); --press: rgba(255,255,255,.033);
  --line: rgba(255,255,255,.083); --ctl: rgba(255,255,255,.061); --ctlhover: rgba(255,255,255,.084); --ctlline: rgba(255,255,255,.093);
  --fg: #ffffff; --fg2: rgba(255,255,255,.786); --fg3: rgba(255,255,255,.545); --chip: rgba(255,255,255,.07);
  --solid: #2c2c2c; --shadow: rgba(0,0,0,.4); --thumb: rgba(0,0,0,.3);
  --new: #f0a050; --onnew: rgba(0,0,0,.9); --ok: #6ccb5f; --danger: #ff99a4;
  --disc: #4c6b22; --discfg: #beee11; --pricebg: rgba(0,0,0,.25);
}
:root.light {
  --card: rgba(255,255,255,.2); --cardhover: rgba(255,255,255,.3); --card2: rgba(255,255,255,.14); --hover: rgba(0,0,0,.045); --press: rgba(0,0,0,.03);
  --line: rgba(0,0,0,.075); --ctl: rgba(255,255,255,.3); --ctlhover: rgba(255,255,255,.42); --ctlline: rgba(0,0,0,.1);
  --fg: rgba(0,0,0,.9); --fg2: rgba(0,0,0,.64); --fg3: rgba(0,0,0,.5); --chip: rgba(0,0,0,.06);
  --solid: #f9f9f9; --shadow: rgba(0,0,0,.14); --thumb: rgba(0,0,0,.08);
  --new: #c25e00; --onnew: #fff; --ok: #0f7b0f; --danger: #c42b1c;
  --disc: #4c6b22; --discfg: #d8f86a; --pricebg: rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: transparent; }
body { color: var(--fg); font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif; overflow: hidden; }
button { font: inherit; color: var(--fg); cursor: pointer; border: 1px solid var(--ctlline); background: var(--ctl); border-radius: 4px; padding: 4px 12px; white-space: nowrap; }
button:hover { background: var(--ctlhover); }
button:active { background: var(--press); color: var(--fg2); }
button.primary { background: var(--accent); border-color: transparent; color: #000; }
:root.light button.primary { color: #fff; }
button.primary:hover { filter: brightness(.94); }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover { background: var(--hover); }
button:disabled { opacity: .45; cursor: default; }
a { color: var(--accent); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--fg3); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }

#app { display: flex; flex-direction: column; height: 100vh; }
#top { display: flex; align-items: center; gap: 8px; padding: 14px 22px 10px; flex-shrink: 0; flex-wrap: wrap; }
#top h2 { margin: 0 4px 0 0; font-size: 20px; font-weight: 600; }
.count { display: inline-flex; align-items: center; justify-content: center; height: 18px; min-width: 18px; padding: 0 6px; border-radius: 9px; font-size: 11px; line-height: 1; font-weight: 600; background: var(--new); color: var(--onnew); }
.seg { display: inline-flex; border: 1px solid var(--ctlline); border-radius: 5px; overflow: hidden; margin-left: 8px; }
.seg button { border: 0; border-radius: 0; background: transparent; color: var(--fg2); padding: 3px 12px; }
.seg button.on { background: var(--ctlhover); color: var(--fg); font-weight: 600; }
#status { flex: 1; min-width: 120px; text-align: right; color: var(--fg3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status.err { color: var(--danger); }
#main { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 22px 60px; scroll-behavior: auto; }
#list { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* 一条 */
.post { border-radius: 8px; background: var(--card); border: 1px solid var(--line); padding: 14px 16px 10px; position: relative; }
.post.seen { opacity: .86; }
.post.fresh { border-color: color-mix(in srgb, var(--new) 55%, transparent); }
.src { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.av { width: 36px; height: 36px; border-radius: 6px; background: var(--thumb) center/cover no-repeat; flex-shrink: 0; overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.src .who { min-width: 0; flex: 1; }
.src .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src .name a { color: var(--fg); }
.src .meta { color: var(--fg3); font-size: 12px; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; flex-shrink: 0; }
.badge.new { background: var(--new); color: var(--onnew); }
.badge.rel { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 45%, transparent); }
.badge.typ { background: var(--chip); color: var(--fg2); }
.post.ev { cursor: pointer; }
.post.ev.open { cursor: default; }
.post.ev.open .title, .post.ev.open .cover { cursor: pointer; }
.tools { display: flex; align-items: center; gap: 2px; flex-shrink: 0; margin-right: -6px; }
.icon { width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; background: transparent; border-color: transparent; color: var(--fg2); }
.icon:hover { background: var(--hover); color: var(--fg); }
.icon svg { width: 17px; height: 17px; fill: currentColor; }
.menu { position: absolute; right: 12px; top: 48px; z-index: 6; min-width: 200px; max-width: 320px; background: var(--solid); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 8px 24px var(--shadow); cursor: default; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; }
.menu button:hover { background: var(--hover); }
.menu .hint { color: var(--fg3); font-size: 12px; padding: 4px 10px 6px; white-space: normal; }
/* 底栏：左 愿望单，中间 展开/收起，右 点赞评论数 */
.post.ev .foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.foot .fl { display: flex; gap: 6px; justify-self: start; }
.foot .fr { justify-self: end; }
.foot .fr .stat { margin-left: 0; }
button.tg { display: inline-flex; align-items: center; gap: 4px; background: transparent; border-color: transparent; color: var(--fg3); font-size: 12.5px; padding: 3px 14px; border-radius: 14px; }
button.tg:hover { background: var(--hover); color: var(--fg); }
button.tg svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
.post.open button.tg svg { transform: rotate(180deg); }
.also { color: var(--fg3); }
.icon.trb { font-size: 13px; font-weight: 600; }
.icon.trb.on { color: var(--accent); }
.trnote { color: var(--fg3); font-size: 12px; margin: -6px 0 8px; }
.trnote.err { color: var(--danger); }
.trnote .dot { display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: var(--accent); margin-right: 6px; vertical-align: middle; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.cmts .chead a { margin-left: 6px; font-size: 12px; }
/* 评论 */
.cmts { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; cursor: default; }
.cmts .chead { color: var(--fg3); font-size: 12px; margin-bottom: 4px; }
.cmt { display: flex; gap: 10px; padding: 6px 0; }
.cmt .cav { width: 28px; height: 28px; border-radius: 4px; flex-shrink: 0; background: var(--thumb); object-fit: cover; }
.cmt .cbody { min-width: 0; flex: 1; }
.cmt .cwho { font-size: 12.5px; color: var(--fg2); }
.cmt .cwho b { color: var(--fg); font-weight: 600; margin-right: 6px; }
.cmt .ctext { overflow-wrap: anywhere; user-select: text; font-size: 13.5px; }
.cmt .ctext blockquote { margin: 4px 0; padding: 4px 10px; border-left: 3px solid var(--line); background: var(--card2); color: var(--fg2); }
.cmts .cmore { margin-top: 2px; font-size: 12.5px; padding: 2px 10px; }
.cmts .cerr { color: var(--fg3); font-size: 12.5px; }
.title { margin: 2px 0 10px; font-size: 18px; font-weight: 600; line-height: 1.35; cursor: pointer; }
.title:hover { color: var(--accent); }
.cover { display: block; width: 100%; border-radius: 6px; cursor: pointer; background: var(--thumb); aspect-ratio: 16 / 9; object-fit: cover; }
.cover.wide { aspect-ratio: auto; }
.summary { color: var(--fg2); margin: 10px 0 4px; overflow-wrap: anywhere; }
.notice { margin: 12px 0; color: var(--fg); }
.desc { color: var(--fg2); margin: 12px 0 4px; }
.foot { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.foot .stat { margin-left: auto; color: var(--fg3); font-size: 12px; }
.foot button { padding: 3px 10px; font-size: 13px; }
button.wish.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }

/* 正文（Steam 新闻的 BBCode） */
.body { margin-top: 12px; color: var(--fg); overflow-wrap: anywhere; user-select: text; }
.body img, .body video { max-width: 100%; border-radius: 4px; display: block; margin: 8px 0; height: auto; }
.body h3, .body h4, .body h5 { margin: 16px 0 6px; }
.body h3 { font-size: 18px; } .body h4 { font-size: 16px; } .body h5 { font-size: 14px; }
.body p { margin: 6px 0; }
.body blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--line); background: var(--card2); }
.body table { border-collapse: collapse; margin: 8px 0; }
.body td, .body th { border: 1px solid var(--line); padding: 4px 8px; }
.body .spoiler { background: var(--fg3); color: transparent; border-radius: 3px; }
.body .spoiler:hover { color: var(--fg); background: var(--chip); }
.body .yt { position: relative; display: block; margin: 8px 0; }
.body .yt img { margin: 0; }
.body .yt span { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.75); color: #fff; padding: 2px 10px; border-radius: 4px; font-size: 13px; }
.body hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

/* 游戏链接卡片（和 Steam 新闻里的一样：左边封面，右边简介、标签、日期、价格） */
.appcard { display: flex; margin: 12px 0 4px; border-radius: 6px; overflow: hidden; background: var(--card2); border: 1px solid var(--line); cursor: pointer; color: var(--fg); text-decoration: none; min-height: 150px; }
.appcard:hover { background: var(--cardhover); text-decoration: none; }
.appcard .cap { width: 46%; max-width: 330px; flex-shrink: 0; object-fit: cover; background: var(--thumb); }
.appcard .info { flex: 1; min-width: 0; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.appcard .aname { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.appcard .ashort { color: var(--fg2); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tags span { background: var(--chip); color: var(--fg2); font-size: 11px; padding: 1px 6px; border-radius: 3px; }
.appcard .adate { color: var(--fg3); font-size: 12px; }
/* 评测：颜色和 Steam 一样（好评蓝、褒贬不一黄、差评橙） */
.appcard .rev { font-size: 12.5px; color: var(--fg2); }
.appcard .rev b { font-weight: 600; margin-right: 6px; }
.rev.pos b { color: #66c0f4; } .rev.mix b { color: #b9a074; } .rev.neg b { color: #c35c2c; } .rev.none b { color: var(--fg3); }
:root.light .rev.pos b { color: #1a7bc4; } :root.light .rev.mix b { color: #8a6d1f; } :root.light .rev.neg b { color: #b0441a; }
.price { margin-top: auto; align-self: flex-end; display: flex; align-items: stretch; border-radius: 3px; overflow: hidden; font-size: 13px; }
.price > * { display: flex; align-items: center; padding: 2px 8px; }
.price .newtag { background: #4a7fd0; color: #fff; font-size: 12px; }
.price .pct { background: var(--disc); color: var(--discfg); font-weight: 700; font-size: 16px; }
.price .amt { background: var(--pricebg); flex-direction: column; align-items: flex-end; justify-content: center; line-height: 1.2; padding: 3px 9px; }
.price .orig { text-decoration: line-through; color: var(--fg3); font-size: 11px; }
.price .cny { color: var(--fg3); font-size: 11px; }

/* 已读分界线 */
#divider { display: flex; align-items: center; gap: 10px; color: var(--fg3); font-size: 12px; margin: 4px 0; }
#divider::before, #divider::after { content: ""; flex: 1; border-top: 1px dashed var(--fg3); opacity: .6; }

.more { text-align: center; color: var(--fg3); padding: 16px; font-size: 13px; }
.empty { max-width: 520px; margin: 80px auto; text-align: center; color: var(--fg2); line-height: 1.8; }
.empty h3 { color: var(--fg); margin: 0 0 8px; font-size: 18px; }
.empty button { margin-top: 14px; }

#totop { position: fixed; right: 30px; bottom: 26px; width: 40px; height: 40px; border-radius: 20px; padding: 0; font-size: 18px; opacity: 0; pointer-events: none; transition: opacity .15s; background: var(--solid); box-shadow: 0 4px 12px var(--shadow); }
#totop.on { opacity: 1; pointer-events: auto; }
#totop svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; margin: auto; }
#totop.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#newpill { position: fixed; left: 50%; transform: translateX(-50%); top: 70px; z-index: 5; display: none; background: var(--accent); color: #000; border: 0; border-radius: 16px; padding: 5px 16px; box-shadow: 0 4px 12px var(--shadow); }
:root.light #newpill { color: #fff; }
#newpill.on { display: block; }
#toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--solid); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 16px; box-shadow: 0 6px 18px var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; max-width: 80%; }
#toast.on { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h2>时间线</h2>
    <span class="count" id="unread" hidden></span>
    <div class="seg" id="filters">
      <button data-f="all" class="on">全部</button>
      <button data-f="release">新发售</button>
    </div>
    <span id="status"></span>
    <button id="jump" title="回到上次读到的地方">跳到上次看到的位置</button>
    <button id="allread">全部标为已读</button>
    <button id="refresh" class="ghost" title="重新从 Steam 读取">刷新</button>
  </div>
  <div id="main"><div id="list"></div></div>
</div>
<button id="newpill">有新内容，点击查看</button>
<button id="totop"></button>
<div id="toast"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const CLAN = 'https://clan.akamai.steamstatic.com/images';

// ---------- 和程序通信 ----------
let nextId = 1;
const pending = new Map();
const host = {
  call(method, args) {
    return new Promise((res, rej) => {
      const id = nextId++;
      pending.set(id, { res, rej });
      chrome.webview.postMessage({ id, method, args: args || {} });
    });
  }
};
function log(message) { chrome.webview.postMessage({ method: 'log', args: { message: String(message) } }); }
window.onerror = (m, s, l) => log(m + ' @' + l);
chrome.webview.addEventListener('message', e => {
  const d = e.data;
  if (!d) return;
  if (d.event) { onEvent(d); return; }
  const p = pending.get(d.id);
  if (!p) return;
  pending.delete(d.id);
  if (d.ok) p.res(d.result); else { const err = new Error(d.error || '出错了'); err.status = d.status; p.rej(err); }
});

// ---------- 主题 ----------
function applyTheme(theme, accent) {
  document.documentElement.classList.toggle('light', theme === 'light');
  if (accent) document.documentElement.style.setProperty('--accent', accent);
}
{ const q = new URLSearchParams(location.search); applyTheme(q.get('theme'), q.get('accent')); }

// ---------- 状态 ----------
// S 由程序保存在 snf.state.json：readUpTo（这个时间及以前的都算已读）、seen（比它新、已经看过的）、tlPos（上次的位置）
let S = { readUpTo: 0, seen: {}, tlPos: null, filter: 'all' };
let status = {};
const items = new Map();          // key -> 条目
const views = {};                 // filter -> { keys, done, loading, error }
let current = null;
let posRestored = false;
// 「上次看到这里」分界线：离开（退出、最小化、缩到托盘）时记下当时的阅读进度，回来后一直停在那里不动；
// 手动刷新后先隐藏，等下次离开时再记。存在 S.divAt 里，下次打开程序也用它。
let divAt = 0;
function leave() { divAt = S.divAt = S.readUpTo || 0; placeDivider(); updateButtons(); save(); }
let saveTimer = 0;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(() => host.call('saveState', { state: S }).catch(() => {}), 800); }
// 退出前程序直接调用：马上记下位置，返回要保存的进度
window.snfFlush = () => { clearTimeout(saveTimer); try { savePosition(); } catch (e) {} S.divAt = S.readUpTo || 0; clearTimeout(saveTimer); return S; };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function safeUrl(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; }
function toast(text, ms) { const t = $('#toast'); t.textContent = text; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms || 2500); }
function errText(e) { return (e && e.message) || String(e); }

function when(t) {
  const d = new Date(t * 1000), now = new Date(), diff = (now - d) / 1000;
  if (diff >= 0 && diff < 60) return '刚刚';
  if (diff >= 0 && diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff >= 0 && diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  return (d.getFullYear() !== now.getFullYear() ? d.getFullYear() + '年' : '') + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
}
function day(t) { const d = new Date(t * 1000); return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
function shortDay(t) { const d = new Date(t * 1000); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }

// ---------- Steam 新闻正文（BBCode → HTML） ----------
function bb(src) {
  src = String(src || '').replace(/\{STEAM_CLAN_IMAGE\}/g, CLAN).replace(/\r\n?/g, '\n');
  const slots = [];
  const put = html => '\u0001' + (slots.push(html) - 1) + '\u0001';
  const attr = (s, k) => { const m = new RegExp(k + '\\s*=\\s*("([^"]*)"|\'([^\']*)\'|([^\\s\\]]+))', 'i').exec(s || ''); return m ? (m[2] ?? m[3] ?? m[4] ?? '') : ''; };
  src = src.replace(/\[img([^\]]*)\]([\s\S]*?)\[\/img\]/gi, (_, a, inner) => { const u = safeUrl(attr(a, 'src') || inner.trim()); return u ? put(`<img src="${esc(u)}" loading="lazy" onerror="this.remove()">`) : ''; });
  src = src.replace(/\[previewyoutube=["']?([\w-]+)[^\]]*\]\s*\[\/previewyoutube\]/gi, (_, id) => put(`<a class="yt" href="https://www.youtube.com/watch?v=${esc(id)}"><img src="https://i.ytimg.com/vi/${esc(id)}/hqdefault.jpg" loading="lazy" onerror="this.style.display='none'"><span>▶ 在 YouTube 观看</span></a>`));
  src = src.replace(/\[video([^\]]*)\]\s*\[\/video\]/gi, (_, a) => { const webm = safeUrl(attr(a, 'webm')), mp4 = safeUrl(attr(a, 'mp4')), poster = safeUrl(attr(a, 'poster')); return (webm || mp4) ? put(`<video controls muted preload="none" ${poster ? `poster="${esc(poster)}"` : ''}>${webm ? `<source src="${esc(webm)}" type="video/webm">` : ''}${mp4 ? `<source src="${esc(mp4)}" type="video/mp4">` : ''}</video>`) : ''; });
  src = src.replace(/\[dynamiclink([^\]]*)\]\s*\[\/dynamiclink\]/gi, (_, a) => { const u = safeUrl(attr(a, 'href')); return u ? put(`<a href="${esc(u)}">${esc(u)}</a>`) : ''; });
  src = src.replace(/\[url\]([^\[]+)\[\/url\]/gi, (_, u) => { const s = safeUrl(u); return s ? put(`<a href="${esc(s)}">${esc(s)}</a>`) : esc(u); });
  const tagRe = /\[(\/?)([a-z0-9*]+)((?:=|\s)[^\]]*)?\]/gi;
  const simple = { b: 'strong', i: 'em', u: 'u', strike: 's', h1: 'h3', h2: 'h4', h3: 'h5', p: 'p', quote: 'blockquote', code: 'code', list: 'ul', olist: 'ol', table: 'table', tr: 'tr', td: 'td', th: 'th', carousel: 'div' };
  let out = '', last = 0, m;
  while ((m = tagRe.exec(src))) {
    out += esc(src.slice(last, m.index)).replace(/\n/g, '<br>');
    last = tagRe.lastIndex;

    else if (tag === 'a') { const u = safeUrl(n.getAttribute('href')); const inner = cleanCommentNode(n); out += u ? `<a data-open="${esc(u)}">${inner}</a>` : inner; }
    else if (tag === 'blockquote' || n.classList.contains('bb_blockquote')) out += `<blockquote>${cleanCommentNode(n)}</blockquote>`;
    else if (tag === 'script' || tag === 'style') continue;
    else out += cleanCommentNode(n);
  }
  return out;
}
function parseComments(html) {
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  return [...doc.querySelectorAll('.commentthread_comment')].map(el => {
    const a = el.querySelector('.commentthread_author_link');
    const name = a ? (a.querySelector('bdi') || a).textContent.trim() : '';
    const av = el.querySelector('.commentthread_comment_avatar a img') || el.querySelector('.commentthread_comment_avatar img');
    const ts = el.querySelector('[data-timestamp]');
    const tx = el.querySelector('.commentthread_comment_text');
    return { id: el.id, name: name || '（匿名）', url: a ? safeUrl(a.getAttribute('href')) : '', avatar: av ? safeUrl(av.getAttribute('src')) : '', t: ts ? +ts.getAttribute('data-timestamp') : 0, html: tx ? cleanCommentNode(tx).replace(/^(\s|<br>)+|(\s|<br>)+$/g, '') : '' };
  });
}
async function loadComments(key, more) {
  const it = items.get(key); if (!it || !it.gid) return;
  let c = cmtCache.get(key);
  if (c && (c.loading || (!more && !c.error && c.list.length))) return;
  if (!c) { c = { total: it.comments, list: [], loading: false, error: null }; cmtCache.set(key, c); }
  c.loading = true; c.error = null; paintComments(key);
  try {
    const r = await host.call('comments', { gid: it.gid, start: c.list.length, count: c.list.length ? 10 : 3 });
    const got = parseComments(r.html).filter(x => !c.list.some(y => y.id === x.id));
    c.list.push(...got); c.total = r.total || c.list.length;
    if (!got.length) c.total = c.list.length;
  } catch (e) { c.error = errText(e); }
  c.loading = false; paintComments(key);
  if (status.autoTr && !c.error) translateComments(key, true);
}
function paintComments(key) {
  const it = items.get(key);
  const box = document.querySelector(`.post[data-key="${CSS.escape(key)}"] .cmts`);
  if (box && it) box.innerHTML = commentsInner(it);
}
const cmtObserver = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) { cmtObserver.unobserve(e.target); loadComments(e.target.dataset.key); }
}, { root: document.getElementById('main'), rootMargin: '400px 0px' });

// ---------- 翻译 ----------
// trState: key -> { busy, done, error, raw, title, summary, body, orig(显示原文) }
const trState = new Map();
const trReq = new Map();      // 请求号 -> key（流式输出用）
let trSeq = 1, trRunning = 0;
const trQueue = [];
function htmlText(html) { const d = document.createElement('div'); d.innerHTML = String(html || '').replace(/<br\s*\/?>/gi, '\n'); return d.textContent.trim(); }
// 需不需要翻译：粗略看文字是不是已经是目标语言
function needsTr(text) {
  text = String(text || '').replace(/https?:\/\/\S+/g, '').replace(/\[[^\]]{1,200}\]/g, ' ');
  const han = (text.match(/[\u3400-\u9fff]/g) || []).length, kana = (text.match(/[\u3040-\u30ff]/g) || []).length;
  const hangul = (text.match(/[\uac00-\ud7af]/g) || []).length, latin = (text.match(/[A-Za-z\u00c0-\u024f\u0400-\u04ff]{2,}/g) || []).length;
  const to = status.trTo || '简体中文';
  if (han + kana + hangul + latin < 2) return false;
  if (/中文/.test(to)) return kana > han * 0.15 || hangul > 0 || latin * 2 > han;
  if (to === 'English') return han + kana + hangul > latin;
  if (to === '日本語') return kana < 3;
  return true;
}
function trShown(it) { const s = trState.get(it.key); return !!(s && !s.orig && (s.done || s.busy) && (s.title || s.summary || s.body)); }
function trTitle(it) { const s = trState.get(it.key); return trShown(it) && s.title ? s.title : it.title; }
function trBody(it) { const s = trState.get(it.key); return trShown(it) && s.body ? s.body : it.body; }
function trSummary(it, sum) {
  const s = trState.get(it.key);
  if (trShown(it)) sum = s.summary || (s.body ? plain(s.body) : sum);
  return sum.length > 160 ? sum.slice(0, 160) + '…' : sum;
}
function trNote(it) {
  const s = trState.get(it.key); if (!s) return '';
  if (s.error) return `翻译失败：${esc(s.error)} · <a data-tr>重试</a>`;
  if (s.busy) return '<span class="dot"></span>正在翻译…';
  if (s.done) return s.orig ? '🌐 显示的是原文 · <a data-tr>显示译文</a>' : '🌐 机器翻译 · <a data-tr>显示原文</a>';
  return '';
}
function splitTr(raw) {
  const out = {};
  for (const name of ['TITLE', 'SUMMARY', 'BODY']) {
    const m = new RegExp('===' + name + '===\\s*\\n?([\\s\\S]*?)(?=\\n?===(TITLE|SUMMARY|BODY)===|$)').exec(raw || '');
    out[name.toLowerCase()] = m ? m[1].replace(/\n?=+[A-Z]*=*\s*$/, '').trim() : '';   // 流式时末尾可能有半截分隔行
  }
  return out;
}
function paintTr(key) {
  const it = items.get(key), post = document.querySelector(`.post[data-key="${CSS.escape(key)}"]`);
  if (!it || !post) return;
  const title = post.querySelector('.title'); if (title) title.textContent = trTitle(it);
  const note = post.querySelector('.trnote'); if (note) { const n = trNote(it); note.innerHTML = n; note.hidden = !n; note.classList.toggle('err', !!(trState.get(key) || {}).error); }
  const sum = post.querySelector('.summary'); if (sum) sum.textContent = trSummary(it, summaryOf(it));
  const btn = post.querySelector('.trb'); if (btn) btn.classList.toggle('on', trShown(it));
  const body = post.querySelector('.body');
  if (body && !body.hidden) {
    cancelAnimationFrame(paintTr.raf);
    paintTr.raf = requestAnimationFrame(() => { body.innerHTML = bb(trBody(it)) || '<span style="color:var(--fg3)">（没有正文）</span>'; });
  } else if (body) body.innerHTML = '';
}
function queueTr(key, force) {
  const it = items.get(key); if (!it || !it.gid) return;
  let s = trState.get(key);
  if (s && (s.busy || (s.done && !force))) return;
  s = { busy: true, done: false, error: null, raw: '', title: '', summary: '', body: '', orig: false };
  trState.set(key, s); paintTr(key);
  trQueue.push({ key, force }); pumpTr();
}
async function pumpTr() {
  while (trRunning < 2 && trQueue.length) {
    const { key, force } = trQueue.shift();
    const it = items.get(key), s = trState.get(key); if (!it || !s) continue;
    trRunning++;
    const req = trSeq++; trReq.set(req, key);
    host.call('translate', { req, gid: it.gid, title: it.title, summary: it.summary || '', body: it.body || '', force: !!force })
      .then(r => { Object.assign(s, { title: r.title || '', summary: r.summary || '', body: r.body || '', done: true }); })
      .catch(e => { s.error = errText(e); })
      .finally(() => { s.busy = false; trReq.delete(req); trRunning--; paintTr(key); pumpTr(); });
  }
}
function onTrStream(d) {
  const key = trReq.get(d.req), s = key && trState.get(key); if (!s || !s.busy) return;
  s.raw = d.text; Object.assign(s, splitTr(d.text)); paintTr(key);
}
function clickTr(post) {
  const key = post.dataset.key, s = trState.get(key);
  if (s && s.done && !s.error) { s.orig = !s.orig; paintTr(key); return; }
  if (s && s.busy) return;
  queueTr(key, !!(s && s.error));
}
async function translateComments(key, auto) {
  const c = cmtCache.get(key); if (!c || c.trLoading) return;
  const todo = c.list.filter(x => !x.tr && needsTr(htmlText(x.html)));
  if (!todo.length) { if (!auto && c.list.some(x => x.tr)) { c.trOn = !c.trOn; paintComments(key); } return; }
  c.trLoading = true; c.trError = null; paintComments(key);
  try {
    const r = await host.call('translateTexts', { texts: todo.map(x => htmlText(x.html)) });
    todo.forEach((x, i) => { if (r[i]) x.tr = r[i]; });
    c.trOn = true;
  } catch (e) { c.trError = errText(e); }
  c.trLoading = false; paintComments(key);
}
const trObserver = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) {
    trObserver.unobserve(e.target);
    const it = items.get(e.target.dataset.key);
    if (status.autoTr && it && needsTr(it.title + ' ' + (it.summary || plain(it.body).slice(0, 400)))) queueTr(it.key);
  }
}, { root: document.getElementById('main'), rootMargin: '300px 0px' });

// ---------- 屏蔽 ----------
function closeMenus() { for (const m of document.querySelectorAll('.post .menu')) m.remove(); }
function openMenu(post) {
  const had = post.querySelector('.menu'); closeMenus(); if (had) return;
  const it = items.get(post.dataset.key); if (!it || !it.block) return;
  const rows = it.block.map((b, i) => `<button data-block="${i}">${b.kind === 'app' ? '屏蔽游戏《' + esc(b.name) + '》' : '屏蔽账号「' + esc(b.name) + '」'}</button>`).join('');
  post.insertAdjacentHTML('beforeend', `<div class="menu">${rows}<div class="hint">屏蔽后它的新闻和新发售都不再显示。可以在「设置」里取消。</div></div>`);
}
async function doBlock(post, i) {
  const it = items.get(post.dataset.key), b = it && it.block && it.block[i]; if (!b) return;
  closeMenus();
  try { await host.call('block', { kind: b.kind, id: b.id, name: b.name, on: true }); }
  catch (e) { toast(errText(e), 4000); return; }
  // 把受影响的几条从页面上拿掉
  const hit = x => (x.block || []).some(y => y.kind === b.kind && y.id === b.id) || (b.kind === 'app' && ((x.release && x.release.appid === b.id) || (x.app && x.app.appid === b.id)));
  const gone = new Set([...items.values()].filter(hit).map(x => x.key));
  for (const v of Object.values(views)) v.keys = v.keys.filter(k => !gone.has(k));
  for (const k of gone) { const el = document.querySelector(`.post[data-key="${CSS.escape(k)}"]`); if (el) el.remove(); items.delete(k); }
  placeDivider(); updateButtons();
  toast(`已屏蔽${b.kind === 'app' ? '游戏《' + b.name + '》' : '账号「' + b.name + '」'}，可以在设置里取消`, 3500);
}

function toggleBody(post) {
  const it = items.get(post.dataset.key); if (!it || it.kind === 'release') return;
  const body = post.querySelector('.body'), btn = post.querySelector('button.tg span');
  if (body.hidden) {
    if (!body.innerHTML) body.innerHTML = bb(trBody(it)) || '<span style="color:var(--fg3)">（没有正文）</span>';
    body.hidden = false; post.querySelector('.summary').hidden = true; post.classList.add('open');
    if (btn) btn.textContent = '收起';
  } else {
    body.hidden = true; post.querySelector('.summary').hidden = false; post.classList.remove('open');
    if (btn) btn.textContent = '展开全文';
    if (post.getBoundingClientRect().top < $('#main').getBoundingClientRect().top) post.scrollIntoView({ block: 'start' });
  }
}

function observeAll() {
  if (current && current.filter === 'all') for (const el of document.querySelectorAll('.post.fresh:not([data-obs])')) { el.dataset.obs = 1; seenObserver.observe(el); }
  for (const el of document.querySelectorAll('.post[data-cmt]:not([data-cobs])')) { el.dataset.cobs = 1; if (!cmtCache.has(el.dataset.key)) cmtObserver.observe(el); }
  if (status.autoTr) for (const el of document.querySelectorAll('.post.ev:not([data-tobs])')) { el.dataset.tobs = 1; if (!trState.has(el.dataset.key)) trObserver.observe(el); }
  const m = $('#more'); if (m) moreObserver.observe(m);
}

// 上次的位置：最上面那条的 key 和它滚出去了多少
let posTimer = 0;
function savePosition() {
  const v = current; if (!v || v.filter !== 'all' || !posRestored) return;
  const main = $('#main'), top = main.getBoundingClientRect().top;
  const post = [...document.querySelectorAll('#list > .post')].find(p => p.getBoundingClientRect().bottom > top + 1);
  if (!post) return;
  const pos = { key: post.dataset.key, off: Math.round(top - post.getBoundingClientRect().top) };
  if (!S.tlPos || S.tlPos.key !== pos.key || S.tlPos.off !== pos.off) { S.tlPos = pos; save(); }
}
function restorePosition() {
  posRestored = true;
  const main = $('#main'); if (main.scrollTop > 50) return;
  const pos = S.tlPos;
  let el = pos && document.querySelector(`.post[data-key="${CSS.escape(pos.key)}"]`), off = el ? pos.off : -60;
  if (!el) el = $('#divider');
  if (!el) return;
  main.scrollTop += el.getBoundingClientRect().top - main.getBoundingClientRect().top + off;
  updateTop();
}
function goTop() {
  const main = $('#main');
  if (current && current.filter === 'all') markAllRead();
  main.scrollTop = 0;
  updateTop();
}
// 右下角的圆按钮：在顶部时是「刷新」，往下滚了是「回到顶部」
const REFRESH_SVG = '<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg>';
function updateTop() {
  const b = $('#totop'), atTop = $('#main').scrollTop < 80, mode = atTop ? 'refresh' : 'top';
  if (b.dataset.mode !== mode) {
    b.dataset.mode = mode;
    b.innerHTML = atTop ? REFRESH_SVG : '↑';
    b.title = atTop ? '刷新' : '回到顶部（同时全部记为已读）';
  }
  b.classList.toggle('on', !!status.loggedIn);
  b.classList.toggle('busy', atTop && !!status.refreshing);
  b.disabled = atTop && !!status.refreshing;
}

// ---------- 状态栏 ----------
function renderStatus() {
  const st = $('#status');
  st.classList.toggle('err', !!status.error && !status.refreshing);
  st.textContent = status.refreshing ? (status.progress || '正在刷新…')
    : status.error ? status.error
    : status.lastRefresh ? '上次刷新 ' + when(status.lastRefresh) + (status.followed ? ` · 关注了 ${status.followed} 个发行商 / 鉴赏家` : '') : '';
  $('#refresh').disabled = !!status.refreshing || !status.loggedIn;
  $('#refresh').textContent = status.refreshing ? '刷新中…' : '刷新';
  updateTop();
}
function setStatus(st) {
  const wasReady = status.ready, wasLogged = status.loggedIn, wasTr = status.tr + '|' + status.autoTr + '|' + status.trTo;
  status = st || {};
  renderStatus();
  if (!current) return;
  if ((status.ready && !wasReady) || status.loggedIn !== wasLogged) reload(true);
  else if (wasTr !== status.tr + '|' + status.autoTr + '|' + status.trTo && current.keys.length) { const top = $('#main').scrollTop; render(); $('#main').scrollTop = top; }
  else if (!status.ready && !current.keys.length) render();
}

function onEvent(d) {
  switch (d.event) {
    case 'status': setStatus(d.status); break;
    case 'theme': applyTheme(d.theme, d.accent); break;
    case 'tr': onTrStream(d); break;
    case 'unread': { const u = $('#unread'); u.hidden = !d.n; u.textContent = d.n > 99 ? '99+' : d.n; break; }
    case 'updated':
      // 手动刷新：分界线先隐藏，下次离开时再记（自动定时刷新不动它）
      if (d.manual) { divAt = S.divAt = 0; placeDivider(); updateButtons(); save(); }
      if (!current || !status.ready) break;
      if ($('#main').scrollTop < 80 || !current.keys.length) reload(true);
      else $('#newpill').classList.add('on');
      break;
    case 'action':
      if (d.action === 'allread') markAllRead();
      else if (d.action === 'leave') leave();
      break;
  }
}

// ---------- 点击 ----------
document.addEventListener('click', async e => {
  const t = e.target;
  const wish = t.closest('[data-wish]');
  if (wish) {
    e.preventDefault(); e.stopPropagation();
    const appid = +wish.dataset.wish, on = !wish.classList.contains('on');
    wish.disabled = true;
    try {
      await host.call('wish', { appid, on });
      for (const it of items.values()) { for (const a of [it.release, it.app]) if (a && a.appid === appid) a.wish = on; }
      for (const b of document.querySelectorAll(`[data-wish="${appid}"]`)) { b.classList.toggle('on', on); b.textContent = on ? '✓ 已在愿望单' : '＋ 愿望单'; }
      toast(on ? '已加入愿望单' : '已移出愿望单');
    } catch (err) { toast(errText(err), 4000); }
    wish.disabled = false;
    return;
  }
  const menuBtn = t.closest('[data-menu]');
  if (menuBtn) { e.preventDefault(); openMenu(menuBtn.closest('.post')); return; }
  const blk = t.closest('[data-block]');
  if (blk) { e.preventDefault(); doBlock(blk.closest('.post'), +blk.dataset.block); return; }
  if (!t.closest('.menu')) closeMenus();
  const trb = t.closest('[data-tr]');
  if (trb) { e.preventDefault(); const p = trb.closest('.post'); if (p) clickTr(p); return; }
  const ctr = t.closest('[data-ctr]');
  if (ctr) { e.preventDefault(); const p = ctr.closest('.post'); if (p) translateComments(p.dataset.key, false); return; }
  const cmore = t.closest('[data-cmore]');
  if (cmore) { e.preventDefault(); const p = cmore.closest('.post'); if (p) loadComments(p.dataset.key, true); return; }
  const open = t.closest('[data-open]');
  if (open) { e.preventDefault(); host.call('open', { url: open.dataset.open }); return; }
  const a = t.closest('a[href]');
  if (a) { e.preventDefault(); const u = safeUrl(a.getAttribute('href')); if (u) host.call('open', { url: u }); return; }
  // 点文章本身：展开 / 收起（展开后点正文、评论不收起，方便看和选字）
  const post = t.closest('.post.ev');
  if (!post || t.closest('button, video, .appcard, .menu, .cmts, summary, details')) { if (!t.closest('[data-toggle]') || !post) return; }
  if (String(window.getSelection() || '').trim()) return;
  if (post.classList.contains('open') && !t.closest('[data-toggle]') && t.closest('.body, .foot')) return;
  toggleBody(post);
});
for (const b of document.querySelectorAll('#filters button')) b.onclick = () => { if (current && current.filter === b.dataset.f) { $('#main').scrollTop = 0; return; } openFilter(b.dataset.f); };
$('#refresh').onclick = () => host.call('refresh').catch(e => toast(errText(e)));
$('#allread').onclick = markAllRead;
$('#jump').onclick = () => { if (current.filter !== 'all') openFilter('all'); const d = $('#divider'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('#totop').onclick = () => { if ($('#totop').dataset.mode === 'refresh') host.call('refresh').catch(e => toast(errText(e))); else goTop(); };
$('#newpill').onclick = () => reload(false);
$('#main').addEventListener('scroll', () => { updateTop(); clearTimeout(posTimer); posTimer = setTimeout(savePosition, 400); if ($('#main').scrollTop < 80 && $('#newpill').classList.contains('on')) reload(true); }, { passive: true });

// ---------- 启动 ----------
(async () => {
  try { const st = await host.call('loadState'); if (st && typeof st === 'object') S = Object.assign(S, st); } catch (e) { log('loadState: ' + errText(e)); }
  S.seen = S.seen || {};
  divAt = S.divAt != null ? S.divAt : (S.readUpTo || 0);
  try { status = await host.call('status'); } catch (e) {}
  renderStatus();
  openFilter(S.filter === 'release' ? 'release' : 'all');
})();
chrome.webview.postMessage({ method: 'ready' });
</script>
